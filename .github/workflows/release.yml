name: CD

on:
  push:
    tags:
      - "*"

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate package versions match tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          FRONTEND_VERSION="$(node -p "require('./plugins/librechat/package.json').version")"
          BACKEND_VERSION="$(node -p "require('./plugins/librechat-backend/package.json').version")"

          echo "Tag version: $VERSION"
          echo "Frontend package version: $FRONTEND_VERSION"
          echo "Backend package version: $BACKEND_VERSION"

          if [ "$FRONTEND_VERSION" != "$BACKEND_VERSION" ]; then
            echo "Error: package versions do not match"
            exit 1
          fi

          if [ "$VERSION" != "$FRONTEND_VERSION" ]; then
            echo "Error: tag $VERSION does not match package version $FRONTEND_VERSION"
            exit 1
          fi

      - name: Generate type declarations
        run: yarn tsc

      - name: Build all packages
        run: yarn build

      - name: Fix plugin metadata
        run: yarn backstage-cli repo fix --publish

      - name: Publish backstage-plugin-librechat
        working-directory: plugins/librechat
        run: |
          yarn pack -o package.tgz
          npm publish package.tgz --access public

      - name: Publish backstage-plugin-librechat-backend
        working-directory: plugins/librechat-backend
        run: |
          yarn pack -o package.tgz
          npm publish package.tgz --access public
