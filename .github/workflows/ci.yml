name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn tsc

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the test results on the PR
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browser
        run: yarn e2e:install

      - name: Run Playwright tests
        run: yarn e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Comment test results on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          REPORT="playwright-report/results.json"
          if [ ! -f "$REPORT" ]; then
            echo "No Playwright JSON report found; skipping comment."
            exit 0
          fi

          PASSED="$(jq -r '.stats.expected // 0' "$REPORT")"
          FAILED="$(jq -r '.stats.unexpected // 0' "$REPORT")"
          FLAKY="$(jq -r '.stats.flaky // 0' "$REPORT")"
          SKIPPED="$(jq -r '.stats.skipped // 0' "$REPORT")"
          DURATION_MS="$(jq -r '.stats.duration // 0' "$REPORT")"
          DURATION_S="$(awk "BEGIN { printf \"%.1f\", ${DURATION_MS}/1000 }")"
          TOTAL=$((PASSED + FAILED + FLAKY + SKIPPED))

          if [ "$FAILED" -gt 0 ]; then
            STATUS="❌ Failed"
          else
            STATUS="✅ Passed"
          fi

          BODY="$(mktemp)"
          {
            echo "<!-- e2e-results -->"
            echo "## 🎭 Playwright E2E Results"
            echo ""
            echo "**${STATUS}** for commit \`${HEAD_SHA}\` — ${DURATION_S}s"
            echo ""
            echo "| Passed | Failed | Flaky | Skipped | Total |"
            echo "| ------ | ------ | ----- | ------- | ----- |"
            echo "| ${PASSED} | ${FAILED} | ${FLAKY} | ${SKIPPED} | ${TOTAL} |"
          } > "$BODY"

          # Upsert: edit the existing results comment if present, else create.
          CID="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- e2e-results -->")) | .id' \
            | head -n1 || true)"
          if [ -n "${CID}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${CID}" \
              -f body="$(cat "$BODY")" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$BODY" >/dev/null
          fi
