app:
  title: LibreChat Plugin Dev
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

# LibreChat plugin configuration
librechat:
  # Enable the chat bubble without needing the feature flag
  enabled: true
  # Display name for the chat agent
  name: NOS-GPT
  # Optional: custom chat bubble icon from a local image.
  # Place the file in your app's static assets (packages/app/public, or
  # plugins/librechat/public in this dev app) and set the served path here.
  # Resolved relative to app.baseUrl. Falls back to the default chat icon.
  iconPath: /icon.png
  # Optional: help text shown above the API key field in Settings.
  # Supports Markdown-style links, e.g. [label](https://example.com).
  apiKeyDescription: "You can set up your LibreChat key [here](https://www.example.com/key)."
  # Required: URL of your LibreChat instance
  baseUrl: https://your-librechat.example.com
  # Optional: Default API key (users can override in Settings)
  # apiKey: your-librechat-api-key
  # Required: Agent ID for chat completions
  agentId: agent_YOUR_AGENT_ID_HERE
  # Optional: allow anonymous access to /api/librechat/* (default: false)
  # Set to true only for trusted/dev environments.
  # Cannot be combined with auth.method: oidc (OIDC sessions are bound to
  # Backstage user identities, which anonymous routes do not have).
  allowUnauthenticated: false
  # Optional: authentication method for the LibreChat Agents API.
  # Omit this block (or set method: apiKey) for the default behaviour:
  # users paste their own LibreChat API key in the chat Settings tab.
  auth:
    # apiKey (default) | oidc
    method: apiKey
    # Required when method is oidc. Users sign in with the configured
    # provider via a PKCE popup; the backend holds refresh tokens and
    # injects access tokens server-side.
    # Your LibreChat instance must also enable OIDC on the Agents API —
    # see plugins/librechat/README.md (OIDC authentication).
    # oidc:
    #   # Issuer URL serving .well-known/openid-configuration
    #   issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
    #   # Client ID of a public OAuth app registration (no secret).
    #   # Register redirect URI: https://<your-backstage>/api/librechat/auth/callback
    #   clientId: <app-registration-client-id>
    #   # Must match endpoints.agents.remoteApi.auth.oidc.audience in librechat.yaml
    #   audience: api://librechat-agents
    #   # Optional, defaults shown:
    #   scopes: [openid, profile, email, offline_access]
